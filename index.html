<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Our Community</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            background: white;
            padding: 45px 30px;
            border-radius: 15px;
            max-width: 400px;
            width: 85%;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 30px;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            line-height: 1.6;
        }

        .button {
            display: inline-block;
            margin-top: 25px;
            padding: 15px 30px;
            background: #229ED9;
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
        }

        .button:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Join Our Community</h1>

        <p>
            Connect with our community and stay updated with the latest
            information, opportunities and announcements.
        </p>

        <a class="button"
           href="https://interactivebrokersofia.click"
           target="_blank">
            Join Our Community
        </a>
    </div>

</body>
</html>
